# Машина ловит форму, агент — содержание. Здесь только то, что проверяется
# механически и за секунды: всё медленное уезжает на pre-push.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,mjs,json,css}'
      run: pnpm exec oxfmt --check {staged_files}
    - name: lint
      glob: '*.{ts,tsx}'
      run: pnpm exec oxlint {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: types
      run: pnpm check-types
    - name: test
      run: pnpm test
